name: Publish barretenberg-rs to crates.io

on:
  # Automatically publish on non-prerelease GitHub releases
  release:
    types: [published]
  # Manual fallback
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match an existing GitHub release, e.g. 0.84.0)"
        required: true
      ref:
        description: "Git ref to checkout (tag, branch, or commit)"
        required: true

jobs:
  publish:
    name: Publish barretenberg-rs
    # Skip nightly/RC/spartan pre-releases; only publish full releases
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      # For release events, extract version from tag (strip leading 'v')
      # For workflow_dispatch, use the input
      PUBLISH_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    steps:
      - name: Derive version
        id: version
        run: echo "version=${PUBLISH_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download bb binary for code generation
        run: |
          curl -L -f -o bb.tar.gz \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ steps.version.outputs.version }}/barretenberg-amd64-linux.tar.gz"
          tar -xzf bb.tar.gz
          chmod +x bb

      - name: Generate Rust bindings from msgpack schema
        working-directory: barretenberg/ts
        run: |
          yarn install --frozen-lockfile
          BB_BINARY_PATH="$GITHUB_WORKSPACE/bb" yarn generate

      - name: Set crate version
        working-directory: barretenberg/rust
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' Cargo.toml

      - name: Verify package contents
        working-directory: barretenberg/rust
        run: |
          cargo package --list --allow-dirty -p barretenberg-rs
          # Ensure generated files are included
          cargo package --list --allow-dirty -p barretenberg-rs | grep -q "src/api.rs"
          cargo package --list --allow-dirty -p barretenberg-rs | grep -q "src/generated_types.rs"

      - name: Publish to crates.io
        working-directory: barretenberg/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.BARRETENBERG_CRATES_IO_TOKEN }}
        run: cargo publish --allow-dirty -p barretenberg-rs

      - name: Alert on failed publish
        uses: JasonEtco/create-an-issue@v2
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRATE_VERSION: ${{ steps.version.outputs.version }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/BARRETENBERG_RS_PUBLISH_FAILED.md
